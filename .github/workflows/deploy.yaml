name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - master   # default branch for this repository

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps

      - name: Build and sync to repo root layout
        run: npm run pages:sync
