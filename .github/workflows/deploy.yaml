name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps

      - name: Build and sync to repo root layout
        run: npm run pages:sync

      - name: Publish built site to master (GitHub Pages root)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in .nojekyll 404.html assets certificates companies data profile resume \
            favicon-32.png favicon.ico favicon.png favicon.svg index.html \
            logo.png logo192.png logo512.png manifest.json robots.txt; do
            [[ -e "$path" ]] && git add -A -- "$path"
          done
          git diff --staged --quiet && echo "No site changes." && exit 0
          git commit -m "chore(pages): deploy production build [skip ci]"
          git push